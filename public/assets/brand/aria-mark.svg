<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Aria — Application Assistant">
  <defs>
    <linearGradient id="aria-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#243f70"/>
      <stop offset="1" stop-color="#0c172c"/>
    </linearGradient>
    <linearGradient id="aria-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffa666"/>
      <stop offset="1" stop-color="#f4772e"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="17" fill="url(#aria-tile)"/>

  <!-- seal ring -->
  <circle cx="32" cy="35" r="17.5" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.4"/>

  <!-- graduation cap -->
  <path d="M32 21.5 L47.5 28 L32 34.5 L16.5 28 Z" fill="#ffffff"/>
  <path d="M23.5 31.8 V38.2 C23.5 41.4 27.5 43.6 32 43.6 C36.5 43.6 40.5 41.4 40.5 38.2 V31.8"
        fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M47.5 28 V36.2" stroke="url(#aria-accent)" stroke-width="2.3" stroke-linecap="round"/>
  <circle cx="47.5" cy="38.6" r="2.2" fill="#f4772e"/>

  <!-- spark -->
  <path d="M47.5 12.5 L48.7 16.1 L52.3 17.3 L48.7 18.5 L47.5 22.1 L46.3 18.5 L42.7 17.3 L46.3 16.1 Z"
        fill="url(#aria-accent)"/>
</svg>
